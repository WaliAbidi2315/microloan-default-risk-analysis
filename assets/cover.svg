<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
<title id="title">Microloan default risk modelling — Wali Abidi</title>
<desc id="desc">An animated analytical canvas with a network graph, risk distribution and model performance signal.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071521"/><stop offset="1" stop-color="#102c38"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#65e0c2"/><stop offset="1" stop-color="#8cb8ff"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#4ed9bb" stop-opacity=".25"/><stop offset="1" stop-color="#4ed9bb" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#b8d9dd" stroke-opacity=".07"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<rect width="1600" height="620" rx="28" fill="url(#bg)"/><rect width="1600" height="620" rx="28" fill="url(#grid)"/>
<circle cx="1270" cy="260" r="270" fill="url(#glow)" filter="url(#blur)"/>
<g font-family="Inter,Arial,sans-serif">
 <text x="92" y="100" fill="#77d9c1" font-size="17" letter-spacing="4">MACHINE LEARNING / CREDIT RISK</text>
 <text x="92" y="205" fill="#f2f7f6" font-size="68" font-weight="700">Microloan default</text>
 <text x="92" y="282" fill="#f2f7f6" font-size="68" font-weight="700">risk modelling<span fill="#71ddc4">.</span></text>
 <text x="96" y="345" fill="#b2c8cc" font-size="23">From exploratory analysis to model evaluation</text>
 <path d="M96 402H500" stroke="url(#accent)" stroke-width="2"/>
 <text x="96" y="452" fill="#75dfc4" font-size="16" letter-spacing="2">900 SYNTHETIC LOANS</text>
 <text x="96" y="492" fill="#d9e7e7" font-size="23" font-weight="600">20% default prevalence</text>
 <text x="96" y="548" fill="#8faab1" font-size="15">WALI ABIDI  /  PYTHON · SCIKIT-LEARN · MODEL VALIDATION</text>
</g>
<!-- Network graph -->
<g stroke="#72d9c2" stroke-opacity=".35" stroke-width="1.5" fill="none">
 <path d="M880 170 1020 112 1160 172 1290 102 1440 165 1370 300 1220 350 1070 285 920 340 880 170"/>
 <path d="M1020 112 1070 285 1160 172 1220 350 1290 102 1370 300 1440 165"/>
 <path d="M920 340 1070 285 1220 350 1370 300"/>
</g>
<g fill="#77e0c8">
 <circle cx="880" cy="170" r="5"/><circle cx="1020" cy="112" r="7"/><circle cx="1160" cy="172" r="5"/>
 <circle cx="1290" cy="102" r="6"/><circle cx="1440" cy="165" r="5"/><circle cx="1370" cy="300" r="7"/>
 <circle cx="1220" cy="350" r="5"/><circle cx="1070" cy="285" r="7"/><circle cx="920" cy="340" r="5"/>
</g>
<g fill="#77e0c8" opacity=".9"><circle r="4"><animateMotion dur="7s" repeatCount="indefinite" path="M880 170 1020 112 1160 172 1290 102 1440 165"/></circle><circle r="3"><animateMotion dur="9s" repeatCount="indefinite" path="M920 340 1070 285 1220 350 1370 300"/></circle></g>
<!-- Performance card -->
<g transform="translate(1050 400)">
 <rect width="420" height="150" rx="16" fill="#102a36" stroke="#b8d9dd" stroke-opacity=".2"/>
 <text x="24" y="34" fill="#91aeb5" font-family="Arial" font-size="13" letter-spacing="2">TOP TEST ROC-AUC</text>
 <text x="24" y="91" fill="#f1f8f7" font-family="Arial" font-size="46" font-weight="700">0.888</text>
 <text x="185" y="86" fill="#78dfc4" font-family="Arial" font-size="14">LOGISTIC REGRESSION</text>
 <path d="M185 111h190" stroke="#294b55" stroke-width="5" stroke-linecap="round"/>
 <path d="M185 111h168" stroke="url(#accent)" stroke-width="5" stroke-linecap="round">
  <animate attributeName="stroke-dasharray" values="0 190;168 190;168 190" dur="3s" repeatCount="indefinite"/>
 </path>
</g>
<g fill="#8ba8b0"><circle cx="1515" cy="65" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle><circle cx="1485" cy="65" r="3" opacity=".4"/><circle cx="1455" cy="65" r="3" opacity=".25"/></g>
</svg>