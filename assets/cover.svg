<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
<title id="title">Microloan default risk modelling — Wali Abidi</title>
<desc id="desc">An animated analytical canvas with a network graph, risk distribution and model performance signal.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071521"/><stop offset="1" stop-color="#102c38"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#65e0c2"/><stop offset="1" stop-color="#8cb8ff"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#4ed9bb" stop-opacity=".25"/><stop offset="1" stop-color="#4ed9bb" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#b8d9dd" stroke-opacity=".07"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<rect width="1600" height="620" rx="28" fill="url(#bg)"/><rect width="1600" height="620" rx="28" fill="url(#grid)"/>
<circle cx="1270" cy="260" r="270" fill="url(#glow)" filter="url(#blur)"/>
<g font-family="Inter,Arial,sans-serif">
 <text x="92" y="100" fill="#77d9c1" font-size="17" letter-spacing="4">MACHINE LEARNING / CREDIT RISK</text>
 <text x="92" y="205" fill="#f2f7f6" font-size="68" font-weight="700">Microloan default</text>
 <text x="92" y="282" fill="#f2f7f6" font-size="68" font-weight="700">risk modelling<span fill="#71ddc4">.</span></text>
 <text x="96" y="345" fill="#b2c8cc" font-size="23">From exploratory analysis to model evaluation</text>
 <path d="M96 402H500" stroke="url(#accent)" stroke-width="2"/>
 <text x="96" y="452" fill="#75dfc4" font-size="16" letter-spacing="2">900 SYNTHETIC LOANS</text>
 <text x="96" y="492" fill="#d9e7e7" font-size="23" font-weight="600">20% default prevalence</text>
 <text x="96" y="548" fill="#8faab1" font-size="15">WALI ABIDI  /  PYTHON · SCIKIT-LEARN · MODEL VALIDATION</text>
</g>
<!-- Bank lending → loan application → machine-learning risk engine → risk decision -->
<g transform="translate(770 108)" font-family="Inter,Arial,sans-serif">
 <!-- connector paths -->
 <path d="M190 170H246" stroke="#72d9c2" stroke-width="3" fill="none" stroke-linecap="round"/>
 <path d="M235 160L247 170L235 180" stroke="#72d9c2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="M480 170H536" stroke="#72d9c2" stroke-width="3" fill="none" stroke-linecap="round"/>
 <path d="M525 160L537 170L525 180" stroke="#72d9c2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
 <!-- bank / lending institution -->
 <g transform="translate(0 34)">
  <rect x="0" y="55" width="190" height="160" rx="16" fill="#102a36" stroke="#4b8f88" stroke-opacity=".7"/>
  <path d="M28 91L95 52L162 91Z" fill="#1a4850" stroke="#76d9c2" stroke-width="2"/>
  <path d="M38 96H152M35 191H155M28 205H162" stroke="#76d9c2" stroke-width="3" stroke-linecap="round"/>
  <g fill="#173b46" stroke="#76d9c2" stroke-width="2">
   <rect x="43" y="101" width="20" height="82" rx="3"/><rect x="85" y="101" width="20" height="82" rx="3"/><rect x="127" y="101" width="20" height="82" rx="3"/>
  </g>
  <text x="95" y="239" fill="#d8efea" font-size="14" text-anchor="middle" letter-spacing="1.5">LENDER</text>
 </g>
 <!-- loan application -->
 <g transform="translate(248 58)">
  <rect width="232" height="224" rx="16" fill="#102a36" stroke="#4b8f88" stroke-opacity=".7"/>
  <rect x="20" y="20" width="192" height="48" rx="8" fill="#173b46"/>
  <path d="M37 37H90M37 49H75" stroke="#8fbab7" stroke-width="3" stroke-linecap="round"/>
  <circle cx="185" cy="44" r="13" fill="#235e5b"/><path d="M179 44l4 4 8-9" fill="none" stroke="#80e0c8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="20" y="94" fill="#eef8f5" font-size="16" font-weight="700">LOAN PROFILE</text>
  <g fill="#8fbab7" font-size="12">
   <text x="20" y="121">Income</text><text x="20" y="151">Loan amount</text><text x="20" y="181">Repayment term</text>
  </g>
  <g stroke="#47747a" stroke-width="5" stroke-linecap="round">
   <path d="M102 117H207M102 147H207M102 177H207"/>
  </g>
  <g fill="#69d9bd">
   <circle cx="111" cy="117" r="4"/><circle cx="153" cy="147" r="4"/><circle cx="185" cy="177" r="4"/>
  </g>
  <text x="116" y="211" fill="#75dfc4" font-size="11" text-anchor="middle" letter-spacing="1">BORROWER FEATURES</text>
 </g>
 <!-- ML model chip and network -->
 <g transform="translate(540 58)">
  <rect width="250" height="224" rx="16" fill="#102a36" stroke="#5b9e96" stroke-width="1.5"/>
  <rect x="20" y="18" width="210" height="188" rx="12" fill="#0d202b" stroke="#315d65"/>
  <text x="125" y="48" fill="#78dfc4" font-size="13" text-anchor="middle" letter-spacing="2">MACHINE LEARNING</text>
  <g stroke="#64cdb5" stroke-opacity=".55" stroke-width="1.5" fill="none">
   <path d="M52 91L104 75L158 94L203 74M52 91L104 130L158 94L203 144M52 169L104 130L158 164L203 144M104 75L104 130L104 184M158 94L158 164"/>
  </g>
  <g fill="#7ce2ca">
   <circle cx="52" cy="91" r="6"/><circle cx="52" cy="169" r="6"/><circle cx="104" cy="75" r="6"/><circle cx="104" cy="130" r="7"/><circle cx="104" cy="184" r="5"/><circle cx="158" cy="94" r="7"/><circle cx="158" cy="164" r="6"/><circle cx="203" cy="74" r="5"/><circle cx="203" cy="144" r="7"/>
  </g>
  <text x="125" y="232" fill="#d8efea" font-size="13" text-anchor="middle" letter-spacing="1">DEFAULT-RISK MODEL</text>
 </g>
 <!-- output card -->
 <g transform="translate(820 58)">
  <rect width="190" height="224" rx="16" fill="#102a36" stroke="#4b8f88" stroke-opacity=".7"/>
  <text x="95" y="38" fill="#91aeb5" font-size="12" text-anchor="middle" letter-spacing="1.5">RISK OUTPUT</text>
  <circle cx="95" cy="104" r="49" fill="#173b46" stroke="#315d65" stroke-width="8"/>
  <path d="M95 55A49 49 0 0 1 141 121" fill="none" stroke="#72d9c2" stroke-width="8" stroke-linecap="round"/>
  <text x="95" y="111" fill="#f1f8f7" font-size="28" font-weight="700" text-anchor="middle">0.32</text>
  <text x="95" y="174" fill="#78dfc4" font-size="14" text-anchor="middle" font-weight="700">RISK SCORE</text>
  <rect x="32" y="190" width="126" height="22" rx="11" fill="#174c46"/>
  <text x="95" y="205" fill="#9cebd6" font-size="10" text-anchor="middle" letter-spacing="1">ILLUSTRATIVE</text>
 </g>
</g>
<g fill="#8ba8b0"><circle cx="1515" cy="65" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle><circle cx="1485" cy="65" r="3" opacity=".4"/><circle cx="1455" cy="65" r="3" opacity=".25"/></g>
</svg>