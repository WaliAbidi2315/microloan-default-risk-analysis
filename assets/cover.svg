<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Microloan default risk — machine learning chart</title>
<desc id="desc">A clean animated ROC chart for a microloan default classifier, alongside the project title and model performance.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071521"/><stop offset="1" stop-color="#12313b"/></linearGradient>
  <linearGradient id="curve" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#62d8bd"/><stop offset="1" stop-color="#9bd9ff"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b8d9dd" stroke-opacity=".055"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .title{font:700 64px Inter,Arial,sans-serif;fill:#f2f7f6;letter-spacing:-1.5px}
  .sub{font:400 23px Inter,Arial,sans-serif;fill:#b2c8cc}
  .eyebrow{font:600 15px Inter,Arial,sans-serif;fill:#78dfc4;letter-spacing:3px}
  .tag{font:600 14px Inter,Arial,sans-serif;fill:#d9e9e8}
  .axis{font:500 13px Inter,Arial,sans-serif;fill:#91aeb5}
  .charttitle{font:700 17px Inter,Arial,sans-serif;fill:#e8f3f1;letter-spacing:1px}
  .metric{font:700 34px Inter,Arial,sans-serif;fill:#78dfc4}
  .roc{fill:none;stroke:url(#curve);stroke-width:5;stroke-linecap:round;stroke-dasharray:700;stroke-dashoffset:700;animation:draw 3.4s ease-out infinite alternate;filter:url(#glow)}
  .area{fill:#63d9bf;opacity:0;animation:fade 3.4s ease-out infinite alternate}
  .dot{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .d1{animation-delay:.25s}.d2{animation-delay:.5s}.d3{animation-delay:.75s}.d4{animation-delay:1s}.d5{animation-delay:1.25s}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:.13}}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(.85)}50%{opacity:1;transform:scale(1.35)}}
  @media(prefers-reduced-motion:reduce){.roc,.area,.dot{animation:none}.roc{stroke-dashoffset:0}.area{opacity:.13}}
</style>
<rect width="1600" height="520" rx="26" fill="url(#bg)"/>
<rect width="1600" height="520" rx="26" fill="url(#grid)"/>
<g font-family="Inter,Arial,sans-serif">
  <text x="82" y="94" class="eyebrow">MACHINE LEARNING / CREDIT RISK</text>
  <text x="80" y="190" class="title">Microloan default</text>
  <text x="80" y="263" class="title">risk modelling<tspan fill="#78dfc4">.</tspan></text>
  <text x="84" y="322" class="sub">Using borrower and loan data to predict</text>
  <text x="84" y="354" class="sub">repayment risk with machine learning.</text>
  <g transform="translate(84 400)">
    <rect width="142" height="34" rx="17" fill="#173b46" stroke="#477b7c"/><text x="71" y="22" text-anchor="middle" class="tag">900 LOANS</text>
    <rect x="154" width="168" height="34" rx="17" fill="#173b46" stroke="#477b7c"/><text x="238" y="22" text-anchor="middle" class="tag">5 CLASSIFIERS</text>
    <rect x="334" width="152" height="34" rx="17" fill="#173b46" stroke="#477b7c"/><text x="410" y="22" text-anchor="middle" class="tag">20% DEFAULT</text>
  </g>
  <text x="84" y="478" fill="#89a8af" font-size="14" letter-spacing="1.5">WALI ABIDI  ·  PYTHON  ·  SCIKIT-LEARN</text>
</g>
<!-- Single animated model-performance chart -->
<g transform="translate(700 62)">
  <rect x="0" y="0" width="820" height="390" rx="22" fill="#0b202b" stroke="#315b63" stroke-width="1.5"/>
  <text x="42" y="48" class="charttitle">LOAN DEFAULT CLASSIFIER</text>
  <text x="42" y="73" class="axis">ROC curve · held-out test set</text>
  <rect x="625" y="25" width="150" height="60" rx="12" fill="#123b3b" stroke="#367d72"/>
  <text x="646" y="47" class="axis">ROC-AUC</text>
  <text x="646" y="75" class="metric">0.888</text>
  <g transform="translate(100 112)">
    <g stroke="#36535c" stroke-width="1">
      <path d="M0 0V220H650"/>
      <path d="M130 0V220M260 0V220M390 0V220M520 0V220" opacity=".55"/>
      <path d="M0 44H650M0 88H650M0 132H650M0 176H650" opacity=".55"/>
    </g>
    <path d="M0 220L650 0" stroke="#8aa3aa" stroke-width="1.5" stroke-dasharray="7 7" opacity=".55"/>
    <path class="area" d="M0 220C22 122 62 55 132 34S310 8 650 0V220Z"/>
    <path class="roc" d="M0 220C22 122 62 55 132 34S310 8 650 0"/>
    <g fill="#7be0c7">
      <circle class="dot" cx="24" cy="119" r="5"/><circle class="dot d1" cx="64" cy="63" r="5"/>
      <circle class="dot d2" cx="132" cy="34" r="5"/><circle class="dot d3" cx="245" cy="16" r="5"/>
      <circle class="dot d4" cx="390" cy="8" r="5"/><circle class="dot d5" cx="540" cy="3" r="5"/>
    </g>
    <g class="axis">
      <text x="0" y="243" text-anchor="middle">0.0</text><text x="325" y="243" text-anchor="middle">0.5</text><text x="650" y="243" text-anchor="middle">1.0</text>
      <text x="-18" y="224" text-anchor="end">0.0</text><text x="-18" y="114" text-anchor="end">0.5</text><text x="-18" y="5" text-anchor="end">1.0</text>
      <text x="325" y="275" text-anchor="middle">FALSE POSITIVE RATE</text>
      <text x="-58" y="110" text-anchor="middle" transform="rotate(-90 -58 110)">TRUE POSITIVE RATE</text>
    </g>
  </g>
  <g transform="translate(610 350)">
    <circle cx="0" cy="0" r="5" fill="#7be0c7"/><text x="14" y="5" class="axis">Default</text>
    <circle cx="100" cy="0" r="5" fill="#8aa3aa"/><text x="114" y="5" class="axis">Repaid</text>
  </g>
</g>
</svg>